# SPDX-License-Identifier: BSD-2-Clause
name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Effects
        run: make -C tests/effects test

  library:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Library
        run: make -C library
      - name: Sound Lab (.3dsx)
        run: make -C examples/soundlab
      - name: Streaming example (.3dsx)
        run: make -C examples/streaming

  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang lld cmake python3
      - name: Cached teak-llvm
        id: cache
        uses: actions/cache@v4
        with:
          path: toolchain/teak-llvm/build/bin
          key: teak-llvm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('toolchain/build_teak_llvm.sh', 'toolchain/patches/*') }}
      - name: Build teak-llvm
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          toolchain/build_teak_llvm.sh
          find toolchain/teak-llvm/build -mindepth 1 -maxdepth 1 ! -name bin -exec rm -rf {} +
      - name: Firmware
        run: |
          cp firmware/opendsp.cdc /tmp/prebuilt.cdc
          cp firmware/aac_tables.bin /tmp/prebuilt-aac-tables.bin
          make -C firmware
      - name: Built firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/opendsp.cdc
            firmware/aac_tables.bin
            firmware/mp3_tables.bin
            firmware/opendsp.elf
            firmware/opendsp.map
          if-no-files-found: error
      - name: Prebuilt firmware
        run: |
          cmp firmware/aac_tables.bin /tmp/prebuilt-aac-tables.bin
          cmp firmware/opendsp.cdc /tmp/prebuilt.cdc
